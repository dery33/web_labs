<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap сторінка</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background-color: #f5f5f5;
        }

        .products {
            display: flex;
            gap: 20px;
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .product-card {
            width: 33%;
        }

        .card {
            background-color: #dbeafe;
        }

        .card-text {
            color: #b91c1c;
            font-weight: bold;
        }

        .form-block {
            margin-top: 40px;
        }



        @media (max-width: 900px) {

            .products {
                flex-wrap: wrap;
            }

            .product-card {
                width: 48%;
            }
        }

        @media (max-width: 600px) {

            .products {
                flex-direction: column;
            }

            .product-card {
                width: 100%;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <!-- Карусель -->

    <div id="carouselExample"
         class="carousel reveal carousel-dark slide">


        <div class="carousel-inner">

            <div class="carousel-item active">
                <img src="https://picsum.photos/1200/400?1"
                     class="d-block w-100"
                     alt="">
            </div>

            <div class="carousel-item">
                <img src="https://picsum.photos/1200/400?2"
                     class="d-block w-100"
                     alt="">
            </div>

            <div class="carousel-item">
                <img src="https://picsum.photos/1200/400?3"
                     class="d-block w-100"
                     alt="">
            </div>

        </div>

        <button class="carousel-control-prev"
                type="button"
                data-bs-target="#carouselExample"
                data-bs-slide="prev">

            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next"
                type="button"
                data-bs-target="#carouselExample"
                data-bs-slide="next">

            <span class="carousel-control-next-icon"></span>
        </button>

    </div>

    <!-- Картки -->

    <div class="products">

        <div class="product-card">

            <div class="card">

                <img src="https://picsum.photos/300/200?4"
                     class="card-img-top"
                     alt="">

                <div class="card-body">

                    <h5 class="card-title">
                        Ноутбук
                    </h5>

                    <p class="card-text">
                        Потужний ноутбук для роботи.
                    </p>

                    <a href="#"
                       class="btn btn-primary">
                        Купити
                    </a>

                </div>

            </div>

        </div>

        <div class="product-card">

            <div class="card">

                <img src="https://picsum.photos/300/200?5"
                     class="card-img-top"
                     alt="">

                <div class="card-body">

                    <h5 class="card-title">
                        Смартфон
                    </h5>

                    <p class="card-text">
                        Сучасний смартфон.
                    </p>

                    <a href="#"
                       class="btn btn-primary">
                        Купити
                    </a>

                </div>

            </div>

        </div>

        <div class="product-card">

            <div class="card">

                <img src="https://picsum.photos/300/200?6"
                     class="card-img-top"
                     alt="">

                <div class="card-body">

                    <h5 class="card-title">
                        Навушники
                    </h5>

                    <p class="card-text">
                        Якісний звук і комфорт.
                    </p>

                    <a href="#"
                       class="btn btn-primary">
                        Купити
                    </a>

                </div>

            </div>

        </div>

    </div>

    <!-- Форма -->

    <div class="form-block">

        <h2>Форма замовлення</h2>

        <form>

            <div class="mb-3">

                <label class="form-label">
                    Ім’я
                </label>

                <input type="text"
                       class="form-control">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input type="email"
                       class="form-control">

            </div>

            <button type="submit mb-3"
                    class="btn btn-success">
                Відправити
            </button>

        </form>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
