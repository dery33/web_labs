<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>8.3</title>
    <style>
        .container{
            margin: 50vh auto;
            width: 60px;
            height: 60px;

            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;

            cursor: pointer;
            background-color: rgb(90, 83, 83);
            border-radius: 8px;
}
        
        .line{
            width: 80%;
            height: 4px;
            background: white;
            border-radius: 2px;
            transition: transform 0.2s ease-out, opacity 0.15s linear;
            animation: bg_color 6s linear infinite ;
        }
        .line:nth-child(1){
            top: 25%;
            animation-delay: 0s;
            
        }
        .line:nth-child(2){
            top: 50%;
            animation-delay: 0.5s;
        }
        .line:nth-child(3){
            top: 75%;
            animation-delay: 1s;
        }
        .container:hover .line:nth-child(1){
            transform: rotate(45deg) translate(11px, 11.5px);
        }
        .container:hover .line:nth-child(2){
            opacity: 0;
        }
        .container:hover .line:nth-child(3){
            transform: rotate(-45deg) translate(11px, -11.5px);
        }
        @keyframes bg_color{
            0%{
                background-color: rgb(255, 255, 255);
            }
            25%{
                background-color: rgb(255, 123, 0);
            }
            75%{
                background-color: rgb(255, 0, 0);
            }
            100%{
                background-color: rgb(255, 255, 255);
            }
        }
    </style>
</html>
<body>
    <div class = "container">   
        <div class = "line"></div>
        <div class = "line"></div>
        <div class = "line"></div>
    </div>
</body>
</html>
